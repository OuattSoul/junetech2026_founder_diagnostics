                options: [
                    { id: 'tc_1', label: { fr: "Lacunes majeures dans l'équipe sur le cœur de métier (ex: pas de Tech).", en: "Major skill gaps in core functions (e.g., no technical capability)." } },
                    { id: 'tc_2', label: { fr: "Équipe incomplète s'appuyant ponctuellement sur des prestataires.", en: "Incomplete team relying heavily on temporary external freelancers." } },
                    { id: 'tc_3', label: { fr: "Compétences essentielles (Tech + Produit/Business) couvertes en interne.", en: "Essential skills (Tech + Product or Business) covered in-house." } },
                    { id: 'tc_4', label: { fr: "Équipe pluridisciplinaire expérimentée et 100% autonome pour exécuter.", en: "Experienced, multi-disciplinary team fully autonomous in executing." } }
                ]
            },
            {
                id: 'financial_readiness', name: 'Financial readiness', category: 'Financial readiness', type: 'radio',
                q: {
                    fr: 'Suivez-vous les coûts, les revenus, les besoins de trésorerie et l\'utilisation des fonds ?',
                    en: 'Do you track costs, revenue, cash needs and use of funds?'
                },
                options: [
                    { id: 'a', label: { fr: "Pas de comptabilité, pas de suivi du compte bancaire ni trésorerie.", en: "No accounting, bank balance tracking, or future runway planning." } },
                    { id: 'b', label: { fr: "Suivi basique des factures sans tableau de bord financier.", en: "Basic invoice tracking without a financial dashboard." } },
                    { id: 'c', label: { fr: "Modèle financier établi avec projections de trésorerie sur 12 mois.", en: "Established financial model with a 12-month cash runway forecast." } },
                    { id: 'd', label: { fr: "Gestion professionnelle : plan d'affectation et de trésorerie maîtrisé.", en: "Professional financial management: capital allocation and cash flow control." } }
                ]
            },
            {
                id: 'legal_ip', name: 'Legal / IP', category: 'Legal / IP', type: 'radio',
                q: {
                    fr: 'À qui appartient le produit/code/marque ? Existe-t-il des enjeux réglementaires ou de données ?',
                    en: 'Who owns the product/code/brand? Are there regulatory or data issues?'
                },
                options: [
                    { id: 'a', label: { fr: "Statut juridique non créé, propriété code/marque floue ou non cédée.", en: "No legal entity; product/code/brand ownership unassigned or unclear." } },
                    { id: 'b', label: { fr: "Entreprise enregistrée mais statuts/accords d'associés basiques.", en: "Company incorporated, but basic cofounder agreements are unaligned." } },
                    { id: 'c', label: { fr: "Propriété intellectuelle sécurisée au nom de la société.", en: "Intellectual property fully assigned to the company; path mapped." } },
                    { id: 'd', label: { fr: "Protection IP complète (brevets/marques), pacte signé, conformité totale.", en: "Complete IP protection, signed cofounder agreement, full compliance." } }
                ]
            },
            {
                id: 'partnership_readiness', name: 'Partnership readiness', category: 'Partnership readiness', type: 'radio',
                q: {
                    fr: 'Quels partenaires sont nécessaires et quelle valeur concrète pouvez-vous leur offrir ?',
                    en: 'Which partners are needed and what concrete value can you offer them?'
                },
                options: [
                    { id: 'a', label: { fr: "Aucun partenaire identifié ou attentes irréalistes envers les tiers.", en: "No partners identified or unrealistic expectations from third parties." } },
                    { id: 'b', label: { fr: "Liste de partenaires cibles sans premier contact ni valeur définie.", en: "Target partners identified, but no outreach or clear value defined." } },
                    { id: 'c', label: { fr: "Discussions avancées en cours avec des partenaires clés.", en: "Advanced discussions underway with strategic partners." } },
                    { id: 'd', label: { fr: "Partenariats stratégiques signés apportant distribution ou technologie.", en: "Formal strategic partnerships signed, delivering distribution or tech." } }
                ]
            },
            {
                id: 'scalability', name: 'Scalability', category: 'Scalability', type: 'textarea',
                q: {
                    fr: 'Qu\'est-ce qui doit devenir moins cher, être automatisé ou standardisé pour grandir ?',
                    en: 'What must become cheaper, automated or standardized to grow?'
                }
            },
            {
                id: 'impact_potential', name: 'Impact potential', category: 'Impact potential', type: 'radio',
                q: {
                    fr: 'Quel changement économique, social ou environnemental mesurable le projet peut-il créer ?',
                    en: 'What measurable economic, social or environmental change could the venture create?'
                },
                options: [
                    { id: 'a', label: { fr: "Pas de réflexion sur l'impact économique, social ou environnemental.", en: "No consideration of economic, social, or environmental impact." } },
                    { id: 'b', label: { fr: "Intention d'impact exprimée mais sans indicateur de mesure précis.", en: "Positive impact intent expressed, but lacks measurable KPIs." } },
                    { id: 'c', label: { fr: "Indicateurs d'impact définis (ex: emplois créés, émission évitée).", en: "Clear impact metrics defined (jobs created, CO2 saved, income)." } },
                    { id: 'd', label: { fr: "Modèle d'impact mesurable, nativement lié à la croissance du CA.", en: "Measurable impact core to business model, scaling with revenue." } }
                ]
            }
        ];

        function App() {
            const [lang, setLang] = useState('fr');
            const [evalType, setEvalType] = useState('founder');
            const [startupName, setStartupName] = useState('');
            const [founderName, setFounderName] = useState('');
            const [email, setEmail] = useState('');
            const [answers, setAnswers] = useState({});
            const [isSubmitting, setIsSubmitting] = useState(false);

            // ÉTATS DES MODALES (POP-UPS)
            const [showSuccessModal, setShowSuccessModal] = useState(false);
            const [missingQuestionsModal, setMissingQuestionsModal] = useState(null); // { founder: [], startup: [] }

            const t = I18N[lang];
            const activeCatalogue = evalType === 'founder' ? FOUNDER_MCQ_CATALOGUE : STARTUP_MCQ_CATALOGUE;

            // 1. RESTAURATION DU BROUILLON CANDIDAT DEPUIS LE LOCALSTORAGE
            useEffect(() => {
                const draft = localStorage.getItem('candidate_form_draft_v1');
                if (draft) {
                    try {
                        const parsed = JSON.parse(draft);
                        if (parsed.startupName) setStartupName(parsed.startupName);
                        if (parsed.founderName) setFounderName(parsed.founderName);
                        if (parsed.email) setEmail(parsed.email);
                        if (parsed.answers) setAnswers(parsed.answers);
                    } catch (e) {
                        console.error("Erreur de récupération du brouillon local :", e);
                    }
                }
            }, []);

            // 2. SAUVEGARDE AUTOMATIQUE DU BROUILLON DANS LE LOCALSTORAGE
            useEffect(() => {
                const draftData = {
                    startupName,
                    founderName,
                    email,
                    answers
                };
                localStorage.setItem('candidate_form_draft_v1', JSON.stringify(draftData));
            }, [startupName, founderName, email, answers]);

            const handleAnswer = (skillId, data) => {
                setAnswers({ ...answers, [skillId]: { ...(answers[skillId] || {}), ...data } });
            };

            // VERIFICATION DE RÉPONSE A UNE QUESTION
            const isQuestionAnswered = (mcq) => {
                const ans = answers[mcq.id];
                if (!ans) return false;

                if (mcq.type === 'textarea') {
                    return ans.textAnswer && ans.textAnswer.trim() !== '';
                }
                if (mcq.type === 'radio' || mcq.type === 'radio_structured') {
                    return !!ans.selectedOption;
                }
                if (mcq.type === 'radio_other') {
                    if (ans.selectedOption === 'other') {
                        return ans.otherText && ans.otherText.trim() !== '';
                    }
                    return !!ans.selectedOption;
                }
                if (mcq.type === 'checkbox') {
                    return Array.isArray(ans.selectedCheckbox) && ans.selectedCheckbox.length > 0;
                }
                return false;
            };

            const handleSubmit = async (e) => {
                e.preventDefault();

                // 1. VÉRIFICATION DES QUESTIONS MANQUANTES
                const missingFounder = FOUNDER_MCQ_CATALOGUE.filter(q => !isQuestionAnswered(q));
                const missingStartup = STARTUP_MCQ_CATALOGUE.filter(q => !isQuestionAnswered(q));

                if (missingFounder.length > 0 || missingStartup.length > 0) {
                    setMissingQuestionsModal({
                        founder: missingFounder,
                        startup: missingStartup
                    });

                    // BASCULE AUTOMATIQUE SUR LE PREMIER VOLET INCOMPLET
                    if (missingFounder.length > 0) {
                        setEvalType('founder');
                    } else if (missingStartup.length > 0) {
                        setEvalType('startup');
                    }
                    return;
                }

                // 2. SOUMISSION SI TOUTES LES QUESTIONS SONT RÉPONDUES
                setIsSubmitting(true);

                const payload = {
                    candidate_id: 'cand_' + Date.now(),
                    startup_name: startupName,
                    founder_name: founderName,
                    email: email,
                    answers: answers
                };

                try {
                    await fetch(GOOGLE_SCRIPT_URL, {
                        method: 'POST',
                        mode: 'no-cors',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(payload)
                    });

                    // SUPPRESSION DU BROUILLON APRES SOUMISSION REUSSIE
                    localStorage.removeItem('candidate_form_draft_v1');

                    setIsSubmitting(false);
                    setShowSuccessModal(true);
                } catch (err) {
                    console.error(err);
                    setIsSubmitting(false);
                    alert(t.submitErrorNotice);
                }
            };

            return (
                <div className="min-h-screen flex flex-col bg-slate-50 text-slate-900 pb-12">
                    <header className="bg-slate-900 text-white px-6 py-4 flex justify-between items-center shadow-md">
                        <div>
                            <h1 className="text-xl font-bold">{t.title}</h1>
                            <p className="text-xs text-slate-400">{t.subtitle}</p>
                        </div>
                        <div className="flex bg-slate-800 p-1 rounded-lg border border-slate-700">
                            <button onClick={() => setLang('fr')} className={`px-3 py-1 rounded text-xs font-bold ${lang === 'fr' ? 'bg-indigo-600 text-white' : 'text-slate-400'}`}>FR</button>
                            <button onClick={() => setLang('en')} className={`px-3 py-1 rounded text-xs font-bold ${lang === 'en' ? 'bg-indigo-600 text-white' : 'text-slate-400'}`}>EN</button>
                        </div>
                    </header>

                    <main className="flex-1 p-6 max-w-4xl mx-auto w-full space-y-6">
                        <form onSubmit={handleSubmit} className="space-y-6">
                            {/* BLOC INFORMATIONS DU CANDIDAT */}
                            <div className="bg-white p-6 rounded-xl border border-slate-200 shadow-sm space-y-4">
                                <h3 className="font-bold text-slate-900 border-b pb-2">Informations Générales</h3>
                                <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
                                    <div>
                                        <label className="block text-xs font-semibold text-slate-600 mb-1">{t.startupNameLabel}</label>
                                        <input required type="text" value={startupName} onChange={e => setStartupName(e.target.value)} className="w-full border p-2.5 rounded-lg text-xs bg-slate-50 focus:bg-white focus:ring-2 focus:ring-indigo-500" placeholder="ex: PayTech" />
                                    </div>
                                    <div>
                                        <label className="block text-xs font-semibold text-slate-600 mb-1">{t.founderNameLabel}</label>
                                        <input required type="text" value={founderName} onChange={e => setFounderName(e.target.value)} className="w-full border p-2.5 rounded-lg text-xs bg-slate-50 focus:bg-white focus:ring-2 focus:ring-indigo-500" placeholder="ex: Alice Dubois" />
                                    </div>
                                    <div>
                                        <label className="block text-xs font-semibold text-slate-600 mb-1">{t.emailLabel}</label>
                                        <input required type="email" value={email} onChange={e => setEmail(e.target.value)} className="w-full border p-2.5 rounded-lg text-xs bg-slate-50 focus:bg-white focus:ring-2 focus:ring-indigo-500" placeholder="alice@paytech.com" />
                                    </div>
                                </div>
                            </div>

                            {/* BASCULE VOLET FONDATEUR / VOLET STARTUP */}
                            <div className="flex space-x-2 bg-slate-200 p-1 rounded-xl">
                                <button type="button" onClick={() => setEvalType('founder')} className={`flex-1 py-2.5 rounded-lg text-xs font-bold transition ${evalType === 'founder' ? 'bg-indigo-600 text-white shadow' : 'text-slate-700'}`}>{t.founderVolet}</button>
                                <button type="button" onClick={() => setEvalType('startup')} className={`flex-1 py-2.5 rounded-lg text-xs font-bold transition ${evalType === 'startup' ? 'bg-emerald-600 text-white shadow' : 'text-slate-700'}`}>{t.startupVolet}</button>
                            </div>

                            {/* LISTE DES QUESTIONS DE L'ONGLET ACTIF */}
                            <div className="space-y-6">
                                {activeCatalogue.map((mcq, idx) => {
                                    const ans = answers[mcq.id] || {};
                                    const catStyle = CATEGORY_STYLES[mcq.category] || 'bg-slate-100 text-slate-700 border-slate-200';
                                    const answered = isQuestionAnswered(mcq);

                                    return (
                                        <div key={mcq.id} className={`bg-white p-6 rounded-xl border shadow-sm space-y-4 transition ${!answered ? 'border-amber-300 ring-1 ring-amber-200' : 'border-slate-200'}`}>
                                            <div className="border-b pb-3 flex justify-between items-start">
                                                <div>
                                                    <span className="text-xs font-bold text-slate-400">Q{idx + 1}.</span>
                                                    <h4 className="font-bold text-slate-900 text-base inline-block ml-2">{mcq.name}</h4>
                                                    <span className="text-rose-600 font-bold ml-1">*</span>
                                                    <p className="text-xs text-indigo-700 font-medium italic mt-1">"{mcq.q[lang]}"</p>
                                                </div>
                                                <span className={`text-[11px] px-2.5 py-0.5 rounded-full font-semibold border ${catStyle}`}>
                                                    {mcq.category}
                                                </span>
                                            </div>

                                            {mcq.type === 'textarea' && (
                                                <textarea rows="3" value={ans.textAnswer || ''} onChange={e => handleAnswer(mcq.id, { textAnswer: e.target.value })} placeholder={t.textAnswerPlaceholder} className="w-full border p-3 rounded-lg text-xs bg-slate-50 focus:bg-white focus:ring-2 focus:ring-indigo-500" />
                                            )}

                                            {mcq.type === 'radio' && (
                                                <div className="grid grid-cols-1 gap-3">
                                                    {mcq.options.map((opt, oIdx) => (
                                                        <label key={oIdx} className={`flex items-start p-3.5 rounded-lg border cursor-pointer ${ans.selectedOption === opt.id ? 'bg-indigo-50 border-indigo-500 ring-1 ring-indigo-500' : 'bg-slate-50 border-slate-200 hover:bg-slate-100'}`}>
                                                            <input type="radio" name={mcq.id} checked={ans.selectedOption === opt.id} onChange={() => handleAnswer(mcq.id, { selectedOption: opt.id })} className="mt-1 h-4 w-4 text-indigo-600" />
                                                            <div className="ml-3 flex-1">
                                                                <span className="text-xs font-bold text-slate-700 uppercase">Option {String.fromCharCode(65 + oIdx)}</span>
                                                                <p className="text-xs text-slate-800 mt-1">{opt.label[lang]}</p>
                                                            </div>
                                                        </label>
                                                    ))}
                                                </div>
                                            )}

                                            {mcq.type === 'radio_other' && (
                                                <div className="grid grid-cols-1 gap-3">
                                                    {mcq.options.map((opt, oIdx) => (
                                                        <label key={oIdx} className={`flex items-start p-3.5 rounded-lg border cursor-pointer ${ans.selectedOption === opt.id ? 'bg-indigo-50 border-indigo-500 ring-1 ring-indigo-500' : 'bg-slate-50 border-slate-200 hover:bg-slate-100'}`}>
                                                            <input type="radio" name={mcq.id} checked={ans.selectedOption === opt.id} onChange={() => handleAnswer(mcq.id, { selectedOption: opt.id, otherText: '' })} className="mt-1 h-4 w-4 text-indigo-600" />
                                                            <div className="ml-3 flex-1">
                                                                <span className="text-xs font-bold text-slate-700 uppercase">Option {String.fromCharCode(65 + oIdx)}</span>
                                                                <p className="text-xs text-slate-800 mt-1">{opt.label[lang]}</p>
                                                            </div>
                                                        </label>
                                                    ))}
                                                    <div className="p-3.5 rounded-lg border bg-slate-50 border-slate-200 space-y-2">
                                                        <span className="text-xs font-bold text-slate-700 uppercase">{t.otherOptionLabel}</span>
                                                        <textarea rows="2" value={ans.otherText || ''} onChange={e => handleAnswer(mcq.id, { selectedOption: 'other', otherText: e.target.value })} placeholder={t.otherPlaceholder} className="w-full border p-2 rounded text-xs bg-white" />
                                                    </div>
                                                </div>
                                            )}

                                            {mcq.type === 'checkbox' && (
                                                <div className="space-y-3">
                                                    <p className="text-xs font-bold italic text-indigo-900 bg-indigo-50 p-2 rounded border border-indigo-100">{t.multiSelectHint}</p>
                                                    <div className="grid grid-cols-1 gap-3">
                                                        {mcq.options.map((opt, oIdx) => {
                                                            const list = ans.selectedCheckbox || [];
                                                            const checked = list.includes(opt.id);
                                                            return (
                                                                <label key={oIdx} className={`flex items-start p-3.5 rounded-lg border cursor-pointer ${checked ? 'bg-indigo-50 border-indigo-500 ring-1 ring-indigo-500' : 'bg-slate-50 border-slate-200 hover:bg-slate-100'}`}>
                                                                    <input type="checkbox" checked={checked} onChange={e => {
                                                                        let updated = [...list];
                                                                        if (e.target.checked) updated.push(opt.id);
                                                                        else updated = updated.filter(item => item !== opt.id);
                                                                        handleAnswer(mcq.id, { selectedCheckbox: updated });
                                                                    }} className="mt-1 h-4 w-4 text-indigo-600 rounded" />
                                                                    <div className="ml-3 flex-1">
                                                                        <span className="text-xs font-bold text-slate-700 uppercase">Option {String.fromCharCode(65 + oIdx)}</span>
                                                                        <p className="text-xs text-slate-800 mt-1">{opt.label[lang]}</p>
                                                                    </div>
                                                                </label>
                                                            );
                                                        })}
                                                    </div>
                                                </div>
                                            )}

                                            {mcq.type === 'radio_structured' && (
                                                <div className="grid grid-cols-1 gap-4">
                                                    {mcq.options.map((opt, oIdx) => {
                                                        const isSelected = ans.selectedOption === opt.id;
                                                        return (
                                                            <label key={oIdx} className={`flex items-start p-4 rounded-xl border cursor-pointer transition ${isSelected ? 'bg-indigo-50 border-indigo-500 ring-2 ring-indigo-500 shadow-sm' : 'bg-slate-50 border-slate-200 hover:bg-slate-100'}`}>
                                                                <input
                                                                    type="radio"
                                                                    name={mcq.id}
                                                                    checked={isSelected}
                                                                    onChange={() => handleAnswer(mcq.id, { selectedOption: opt.id })}
                                                                    className="mt-1 h-4 w-4 text-indigo-600 border-slate-300 focus:ring-indigo-500"
                                                                />
                                                                <div className="ml-3 flex-1">
                                                                    <h5 className="text-xs font-bold text-indigo-900 border-b border-slate-200 pb-1 mb-2">{opt.title[lang]}</h5>
                                                                    <ul className="grid grid-cols-1 md:grid-cols-2 gap-1.5 text-xs text-slate-700">
                                                                        {opt.items.map((item, itemIdx) => (
                                                                            <li key={itemIdx} className="flex items-center space-x-1.5">
                                                                                <span className="text-indigo-500 font-bold">•</span>
                                                                                <span>{item[lang]}</span>
                                                                            </li>
                                                                        ))}
                                                                    </ul>
                                                                </div>
                                                            </label>
                                                        );
                                                    })}
                                                </div>
                                            )}
                                        </div>
                                    );
                                })}
                            </div>

                            <div className="flex justify-end pt-4">
                                <button disabled={isSubmitting} type="submit" className="bg-emerald-600 hover:bg-emerald-500 disabled:bg-slate-400 text-white font-bold text-sm px-8 py-4 rounded-xl shadow-lg transition">
                                    {isSubmitting ? t.submittingBtn : `✓ ${t.submitBtn}`}
                                </button>
                            </div>
                        </form>
                    </main>

                    {/* MODAL POP-UP DE QUESTIONS NON RÉPONDUES */}
                    {missingQuestionsModal && (
                        <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center p-4 z-50">
                            <div className="bg-white rounded-2xl p-6 max-w-md w-full shadow-2xl space-y-4 border border-rose-100">
                                <div className="flex items-center space-x-3 text-rose-600">
                                    <div className="bg-rose-100 p-3 rounded-xl font-bold text-xl">⚠️</div>
                                    <div>
                                        <h3 className="font-bold text-slate-900 text-lg">{t.missingTitle}</h3>
                                        <p className="text-xs text-slate-500 mt-0.5">{t.missingPrompt}</p>
                                    </div>
                                </div>

                                <div className="max-h-60 overflow-y-auto space-y-3 bg-slate-50 p-3 rounded-xl border text-xs">
                                    {missingQuestionsModal.founder.length > 0 && (
                                        <div>
                                            <p className="font-bold text-indigo-700 mb-1">{t.founderVolet} ({missingQuestionsModal.founder.length}) :</p>
                                            <ul className="list-disc pl-5 text-slate-700 space-y-0.5">
                                                {missingQuestionsModal.founder.map(q => <li key={q.id}>{q.name}</li>)}
                                            </ul>
                                        </div>
                                    )}

                                    {missingQuestionsModal.startup.length > 0 && (
                                        <div className="mt-2">
                                            <p className="font-bold text-emerald-700 mb-1">{t.startupVolet} ({missingQuestionsModal.startup.length}) :</p>
                                            <ul className="list-disc pl-5 text-slate-700 space-y-0.5">
                                                {missingQuestionsModal.startup.map(q => <li key={q.id}>{q.name}</li>)}
                                            </ul>
                                        </div>
                                    )}
                                </div>

                                <button
                                    onClick={() => setMissingQuestionsModal(null)}
                                    className="w-full bg-slate-900 hover:bg-slate-800 text-white py-3 rounded-xl text-xs font-bold transition shadow-md"
                                >
                                    {t.closeBtn}
                                </button>
                            </div>
                        </div>
                    )}

                    {/* MODAL POP-UP FIXE DE SOUMISSION RÉUSSIE */}
                    {showSuccessModal && (
                        <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center p-4 z-50">
                            <div className="bg-white rounded-2xl p-8 max-w-md w-full shadow-2xl text-center space-y-4 border border-emerald-100">
                                <div className="w-16 h-16 bg-emerald-100 text-emerald-600 rounded-full flex items-center justify-center text-3xl font-bold mx-auto">
                                    ✓
                                </div>
                                <h3 className="font-extrabold text-slate-900 text-xl">{t.submittedNotice}</h3>
                                <p className="text-xs text-slate-600 leading-relaxed">{t.submittedNoticeDetail}</p>
                                <button
                                    onClick={() => window.location.reload()}
                                    className="w-full bg-emerald-600 hover:bg-emerald-500 text-white py-3 rounded-xl text-xs font-bold shadow-lg transition"
                                >
                                    OK
                                </button>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>

</html>
